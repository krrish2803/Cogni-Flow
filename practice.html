<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice — Socratic Scaffold</title><link rel="stylesheet" href="public/app.css"><style>.page{width:min(820px,calc(100% - 36px));margin:auto;padding:45px 0}.card{padding:25px}.card h1{margin:12px 0;font:500 42px "Playfair Display",serif}.task{padding:16px;border-radius:9px;background:rgba(209,179,110,.07);line-height:1.7;font-size:13px}.answer{width:100%;min-height:175px;margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:9px;background:rgba(0,0,0,.2);color:var(--ivory);resize:vertical}.result{margin-top:17px;padding:17px;border:1px solid rgba(209,179,110,.35);border-radius:9px}.result strong{display:block;color:var(--goldsoft);font:500 32px "Playfair Display",serif}.result p{color:var(--muted);font-size:13px;line-height:1.6}</style></head><body><header class="top"><a class="brand" href="workspace.html"><span class="mark">S</span>Socratic Scaffold</a><nav class="top-nav"><a href="workspace.html">Workspace</a><a href="student-dashboard.html">Student dashboard</a><button class="button" id="logout">Sign out</button></nav></header><main class="page"><article class="panel card"><div class="eyebrow">Practice and feedback</div><h1 id="title">Loading practice…</h1><div class="task" id="prompt"></div><textarea class="answer" id="answer" placeholder="Write your explanation or code attempt here…"></textarea><button class="button gold" id="submit">Submit for feedback →</button><div class="result hidden" id="result"></div></article></main><script src="public/app.js"></script><script>const q=s=>document.querySelector(s);const params=new URLSearchParams(location.search);const practiceId=params.get('practiceId');let practice;async function load(){if(!session.user){location.replace('workspace.html');return}const data=await api('/practice/history');practice=data.practice.find(item=>item._id===practiceId);if(!practice)throw new Error('Practice task not found. Return to the workspace and start a new task.');q('#title').textContent=practice.concept||'Practice task';q('#prompt').textContent=practice.prompt}q('#submit').onclick=async()=>{const response=q('#answer').value.trim();if(!response)return;const button=q('#submit');button.disabled=true;button.textContent='Evaluating…';try{const data=await api(`/practice/${practiceId}/submit`,{method:'POST',body:{response}});const passed=data.evaluation.passed;q('#result').classList.remove('hidden');q('#result').innerHTML=`<div class="eyebrow">${passed?'Practice validated':'Keep practising'}</div><strong>${data.submission.score}%</strong><p>${escapeHtml(data.evaluation.feedback)}</p>${passed?'<p>✓ Mastery evidence saved. Continue to your next learning challenge.</p>':'<p>Review the feedback, improve your response, and submit again.</p>'}`;if(passed)await api('/mastery/validate',{method:'POST',body:{conversationId:practice.conversationId,concept:practice.concept,task:practice.prompt,response}})}catch(error){alert(error.message)}finally{button.disabled=false;button.textContent='Submit for feedback →'}};q('#logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch(_){}session.token=null;session.user=null;location.replace('workspace.html')};load().catch(error=>{q('#title').textContent='Practice unavailable';q('#prompt').textContent=error.message})</script></body></html>
